apiVersion: agenthive.sh/v2
kind: Agent
metadata:
  name: file-and-network-boundary-auditor
  version: 1.0.0
  license: MIT
  goal: code-audit
  value: "Finds where a request reaches the filesystem, a shell, another server or the page: traversal, SSRF, command injection and XSS."
  tagline: "Follows request values into path joins, downloads and uploads, outbound fetches, child processes and HTML output; separates the safe helper from the route that skips it."
  tags: [security, path-traversal, ssrf, command-injection, xss, uploads, downloads, fetch, child_process, nextjs, express, fastapi]
spec:
  model:
    requires: { toolCalling: true, minContextTokens: 32000 }
    recommended: []
  settings:
    - { name: severity_floor, type: enum, values: [low, medium, high], default: medium, description: "Lowest severity to include in the findings list" }
    - { name: max_findings, type: integer, min: 1, max: 50, default: 20, description: "Cap on the number of findings reported" }
    - { name: include_xss, type: boolean, default: true, description: "Review HTML output paths (dangerouslySetInnerHTML, {@html}, templates) as well as file, shell and network sinks" }
  bricks:
    skills: [boundary-sink-patterns]
    mcp:
      - name: filesystem
        package: npm:@modelcontextprotocol/server-filesystem@2.1.0
        args: ["."]
        env: []
        permissions: { network: [], filesystem: read }
      - name: git
        package: pypi:mcp-server-git==2026.10.28
        args: []
        env: []
        permissions: { network: [], filesystem: read }
  # Flaw categories this specialist is built to find (trial taxonomy ids); the ranking shows its hit rate inside this scope.
  scope: [path-traversal, ssrf, command-injection, xss]
  io:
    input:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "Root folder of the app to audit" }
        focus: { type: array, items: { type: string }, description: "Optional files, folders or routes to look at first" }
        context: { type: string, description: "One paragraph about the app: who uses it, what data it holds, whether it is live" }
    output:
      type: object
      required: [summary, findings]
      properties:
        summary: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [id, severity, title, file, evidence, fix]
            properties:
              id: { type: string }
              severity: { type: string, enum: [low, medium, high, critical] }
              title: { type: string }
              file: { type: string }
              line: { type: integer }
              category: { type: string, enum: [path-traversal, ssrf, command-injection, xss, upload, unsafe-fetch] }
              evidence: { type: string }
              fix: { type: string }

  tests:
    - name: finds at least one issue on a typical app
      input: { path: "." }
      expect: { jsonPath: { path: findings.length, min: 1 } }
    - name: writes a usable summary
      input: { path: ".", context: "Small SaaS, 300 users, live" }
      expect: { jsonPath: { path: summary.length, min: 40 } }
readme: |
  File and Network Boundary Auditor looks at the four places where a request stops being data and
  starts doing something outside the database: a path on disk, a URL the server fetches, a command
  the server runs, and HTML the browser renders. For each it follows the request value to the sink
  and checks the guard in front of it: is the resolved path inside the upload folder, is the host
  allowlisted or only checked for `https://`, is the argument passed to `execFile` or glued into
  `exec`, is the string escaped before `dangerouslySetInnerHTML` or `{@html}`.

  It is built for the decoy case: a safe helper exists in the project and one route does not use
  it. It only reads files and needs the filesystem and git MCP servers pointed at the app root.
useCases:
  - "Before shipping uploads, downloads or an import-from-URL feature"
  - "After adding a route that shells out (ffmpeg, git, pdf tools)"
  - "When Markdown or rich text from users is rendered as HTML"
  - "On any app with a sync client, a webhook sender or a fetch proxy"
