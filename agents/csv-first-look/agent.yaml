apiVersion: agenthive.sh/v2
kind: Agent
metadata:
  name: csv-first-look
  version: 1.0.0
  license: MIT
  goal: data-analysis
  value: "Profiles a pasted CSV or table: what each column holds, what is missing or odd, which questions the data can and cannot answer."
  tagline: "Reads a sample of rows, infers column types and roles, finds blanks, duplicates, outliers and format mixes, and tells you what analysis the table supports before you waste an afternoon on it."
  tags: [data-analysis, csv, data-quality, profiling, spreadsheet, exploration]
spec:
  model:
    requires: { toolCalling: false, minContextTokens: 16000 }
    recommended: []
  settings:
    - { name: language, type: enum, values: [auto, en, fr], default: auto, description: "Language of the output; auto follows the input" }
    - { name: max_issues, type: integer, min: 3, max: 30, default: 12, description: "Cap on the issues list" }
  bricks:
    skills: [data-profiling-checklist]
    mcp: []
  io:
    input:
      type: object
      required: [data]
      properties:
        data: { type: string, description: "The CSV text or a pasted table with a header row; a sample of up to a few hundred rows" }
        goal: { type: string, description: "Optional: what you hope to learn from it" }
    output:
      type: object
      required: [summary, columns]
      properties:
        summary: { type: string }
        columns: { type: array, items: { type: object, required: [name, type, role], properties: { name: { type: string }, type: { type: string }, role: { type: string, enum: [identifier, dimension, measure, date, text, flag, unknown] }, notes: { type: string } } } }
        issues: { type: array, items: { type: object, required: [issue, where, severity], properties: { issue: { type: string }, where: { type: string }, severity: { type: string, enum: [blocking, important, minor] }, example: { type: string }, fix: { type: string } } } }
        can_answer: { type: array, items: { type: string } }
        cannot_answer: { type: array, items: { type: string } }
        assumptions: { type: array, items: { type: string } }
        questions: { type: array, items: { type: string } }
  tests:
    - name: returns a non-empty result
      input: { data: "id,date,amount,city\n1,2026-01-03,12.5,Paris\n2,03/01/2026,,Lyon\n2,2026-01-04,8,paris" }
      expect: { jsonPath: { path: columns.length, min: 1 } }
    - name: writes a usable summary
      input: { data: "id,date,amount,city\n1,2026-01-03,12.5,Paris\n2,03/01/2026,,Lyon\n2,2026-01-04,8,paris" }
      expect: { jsonPath: { path: summary.length, min: 40 } }
readme: |
  CSV First Look is the ten minutes you should spend before analysing a table and usually do not.
  From a pasted sample it names what each column holds and what role it plays (identifier,
  dimension, measure, date), then lists what is wrong: blanks, duplicated keys, mixed date formats,
  case variants of the same value, numbers stored as text, outliers that look like unit errors.
  It ends with the questions the table can answer as is, the ones it cannot, and the fix for each
  issue.

  It reasons on the rows you paste; it says when a sample is too small to judge a column.
useCases:
  - "Before building a dashboard on an export"
  - "When a spreadsheet from another team arrives"
  - "To write the cleaning steps before a pivot"
  - "To tell a stakeholder why a number cannot be produced yet"
