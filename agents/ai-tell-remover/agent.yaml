apiVersion: agenthive.sh/v2
kind: Agent
metadata:
  name: ai-tell-remover
  version: 1.0.0
  license: MIT
  goal: writing
  value: "Rewrites a pasted text so it stops reading as generated: cuts the patterns, keeps the meaning, and lists what it changed."
  tagline: "Removes the reveals, triads, em dashes, hedges, balanced cadence and empty transitions that mark generated prose; returns the edited text, a diff of changes, and the tells it found."
  tags: [writing, editing, copy-editing, ai-tells, plain-language, humanize, tone]
spec:
  model:
    requires: { toolCalling: false, minContextTokens: 16000 }
    recommended: []
  settings:
    - { name: language, type: enum, values: [auto, en, fr], default: auto, description: "Language of the output; auto follows the input" }
    - { name: register, type: enum, values: [keep, casual, neutral, formal], default: keep, description: "Target register; keep preserves the input's" }
    - { name: max_cut_ratio, type: number, min: 0, max: 0.6, default: 0.3, description: "Maximum share of words the edit may remove" }
  bricks:
    skills: [ai-tells-catalogue]
    mcp: []
  io:
    input:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "The text to edit, pasted" }
        audience: { type: string, description: "Optional: who reads it and through which channel (email, Slack, blog, doc)" }
    output:
      type: object
      required: [summary, edited]
      properties:
        summary: { type: string }
        edited: { type: string }
        changes: { type: array, items: { type: object, properties: { before: { type: string }, after: { type: string }, tell: { type: string } } } }
        tells_found: { type: array, items: { type: string } }
        assumptions: { type: array, items: { type: string } }
        questions: { type: array, items: { type: string } }
  tests:
    - name: returns a non-empty result
      input: { text: "It's not just a tool, it's a mindset. Fast, reliable, and secure — our platform streamlines, simplifies and scales. In today's fast-paced world, teams need more." }
      expect: { jsonPath: { path: edited.length, min: 1 } }
    - name: writes a usable summary
      input: { text: "It's not just a tool, it's a mindset. Fast, reliable, and secure — our platform streamlines, simplifies and scales. In today's fast-paced world, teams need more." }
      expect: { jsonPath: { path: summary.length, min: 40 } }
readme: |
  AI Tell Remover edits a text so it no longer carries the fingerprints of generated prose: the
  "it's not X, it's Y" reveal, lists of three for rhythm, em dashes as glue, "in today's fast-paced
  world", "let's dive in", hedges stacked on hedges, every sentence the same length, a closing
  line that restates the paragraph. It keeps the meaning and the author's facts, changes only
  what reads as a pattern, and returns the edited text next to a list of each change and the tell
  it removed, so the author learns the patterns too.

  It will not add facts, claims or jokes, and it will not change the register unless asked.
useCases:
  - "Before sending a message a colleague might read as generated"
  - "Cleaning a first draft written with an assistant"
  - "Editing marketing copy that sounds like every other page"
  - "Teaching a team which patterns to avoid"
