<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #09090b; color: #fafafa; font-family: Inter, sans-serif; overflow: hidden; }
  .bg { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.07) 1.5px, transparent 1.5px); background-size: 28px 28px; }
  .glow { position: absolute; width: 700px; height: 700px; right: -200px; top: -250px; border-radius: 50%; background: radial-gradient(circle, rgba(245,184,0,0.18), transparent 60%); }
  .wrap { position: relative; padding: 72px 80px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 600; }
  .logo b { color: #f5b800; font-weight: 600; }
  h1 { font-size: 72px; line-height: 1.05; letter-spacing: -0.03em; margin: 0; max-width: 980px; font-weight: 700; }
  h1 span { color: #f5b800; }
  p { font-size: 28px; color: #a1a1aa; margin: 22px 0 0; max-width: 900px; line-height: 1.35; }
  .chips { display: flex; gap: 12px; font-family: "JetBrains Mono", monospace; font-size: 20px; }
  .chip { border: 1.5px solid #27272a; border-radius: 10px; padding: 8px 16px; color: #a1a1aa; background: #111113; }
  .chip.ok { color: #22c55e; border-color: rgba(34,197,94,0.4); }
</style>
</head>
<body>
<div class="bg"></div><div class="glow"></div>
<div class="wrap">
  <div class="logo">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f5b800" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/></svg>
    agenthive<b>.sh</b>
  </div>
  <div>
    <h1>The registry for <span>interoperable</span> AI agents.</h1>
    <p>Discover, audit, run and publish agents across LangGraph, CrewAI, AutoGen, MCP and A2A. One manifest, any runtime.</p>
  </div>
  <div class="chips">
    <span class="chip">LangGraph</span><span class="chip">CrewAI</span><span class="chip">AutoGen</span><span class="chip">MCP</span><span class="chip">A2A</span><span class="chip ok">audited 100%</span>
  </div>
</div>
</body>
</html>
